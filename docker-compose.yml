services:
  # 1) Creates the `att` schema and (optionally) the first admin. Safe to re-run.
  db-setup:
    build: { context: ., target: tools }
    env_file: .env
    restart: "no"

  # 2) The dashboard
  app:
    build: { context: ., target: runner }
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      db-setup:
        condition: service_completed_successfully

  # Optional local Postgres for development only: docker compose --profile localdb up
  # (n8n must read/write the SAME database, so in production point DATABASE_URL at the Postgres n8n uses.)
  localdb:
    profiles: ["localdb"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

volumes:
  pgdata:
