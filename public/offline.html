<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Offline | School Attendance</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f8fafc;color:#0f172a;padding:24px;text-align:center}
  .box{max-width:360px}
  img{width:84px;height:84px;border-radius:20px}
  h1{font-size:22px;margin:18px 0 8px}
  p{color:#64748b;margin:0 0 22px;line-height:1.5}
  button{background:#4f46e5;color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <img src="/icons/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>Attendance needs an internet connection so parents get their WhatsApp message. Please check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
