# Run the dashboard ON THE SAME SERVER as n8n, using the SchoolDB container that
# n8n already talks to. Use this instead of docker-compose.yml on the VPS:
#
#   docker compose -f docker-compose.server.yml up -d --build
#
# The app joins n8n's Docker network (default name: n8n_default) so the hostname
# `schooldb` resolves to the very same database n8n reads. Dashboard and n8n
# then always see the same attendance rows.
#
# Change the network name below if yours differs:
#   docker inspect n8n -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}'
services:
  # API server: business logic, database access, WhatsApp queue + scheduler. Internal only (no published port).
  api:
    build: { context: ./backend }
    container_name: school-attendance-api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${SCHOOLDB_USER:-schooladmin}:${SCHOOLDB_PASSWORD}@schooldb:5432/${SCHOOLDB_NAME:-schooldb}}
      DATABASE_SSL: "false"
      PORT: "4000"
      NODE_OPTIONS: "--max-old-space-size=256"
    restart: unless-stopped
    mem_limit: 350m
    networks: [n8n_net]

  # Thin web app. Talks only to the API (API_URL).
  app:
    build: { context: ., target: runner }
    container_name: school-attendance-app
    environment:
      API_URL: http://api:4000
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_OPTIONS: "--max-old-space-size=200"
    ports:
      - "${APP_PORT:-3400}:3000"
    restart: unless-stopped
    mem_limit: 250m
    depends_on: [api]
    networks: [n8n_net]

  # Create/refresh the schema and the first admin / super admin (safe to re-run):
  #   docker compose -f docker-compose.server.yml run --rm api-setup
  api-setup:
    profiles: ["setup"]
    build: { context: ./backend }
    command: ["node", "dist/cli-setup.js"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${SCHOOLDB_USER:-schooladmin}:${SCHOOLDB_PASSWORD}@schooldb:5432/${SCHOOLDB_NAME:-schooldb}}
      DATABASE_SSL: "false"
    restart: "no"
    networks: [n8n_net]

networks:
  n8n_net:
    external: true
    name: ${N8N_NETWORK:-n8n_default}

